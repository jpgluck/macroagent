[project]
name = "macroagent-forecaster"
version = "1.0.0"
description = "AI-powered macro-economic demand forecasting with FRED data and Prophet"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "JP Gluck"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: marks tests that train real Prophet models (deselect with '-m \"not slow\"')"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
